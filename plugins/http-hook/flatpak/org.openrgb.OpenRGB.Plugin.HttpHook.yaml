id: org.openrgb.OpenRGB.Plugin.HttpHook
branch: '5'
extension-tag: org.openrgb.OpenRGB.Plugin
build-extension: true
separate-locales: false

runtime: org.openrgb.OpenRGB
runtime-version: 'master'
sdk: org.kde.Sdk//6.10

build-options:
  prefix: /app/lib/openrgb/plugins/HttpHook

modules:
  - name: openrgb-plugin-http-hook
    buildsystem: qmake
    post-install:
      - mv ${FLATPAK_DEST}/lib/openrgb/plugins/libOpenRGBHttpHookPlugin.so ${FLATPAK_DEST}/libOpenRGBHttpHookPlugin.so
      - rm -rf ${FLATPAK_DEST}/lib
      - install -Dm644 OpenRGBHttpHookPlugin.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/openrgb-http-hook-plugin.png
    sources:
      - type: dir
        path: ../

